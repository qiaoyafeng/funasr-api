[project]
name = "funasr-api"
version = "0.1.0"
description = "FunASR unified speech recognition API service with offline and realtime support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "funasr>=1.3.26",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "websockets>=12.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
vllm = [
    "vllm>=0.19.0",
    "safetensors>=0.4.0",
    "tiktoken>=0.7.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
funasr-api = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
